# The test bench (possession/io/bench.py). Read by scripts/bench_score.py and scripts/bench_build.py
# for their defaults; command-line flags still win.

bench:
  src: data/external/metrica_sample     # Metrica public sample games, g1/ g2/ g3/
  dir: outputs/bench                    # built .npz files (git-ignored)
  games: [g1, g2, g3]
  variant: degraded                     # default copy: clean | degraded | hard | tracked | tracked_all | real | real_occ
                                        # (--variant decision = real, real_occ, hard, degraded)
  labellers: [v4, v5]                   # default labellers to score
  seed: 7                               # degradation noise; build in the pinned environment
